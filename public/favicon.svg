<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer deep burgundy wax seal disk -->
  <circle cx="32" cy="32" r="30" fill="#4A1521" />
  
  <!-- Subtle gold concentric pressed rings -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#B89F7C" stroke-width="1.2" stroke-dasharray="2.5 1.5" opacity="0.85" />
  <circle cx="32" cy="32" r="24" fill="none" stroke="#8C7355" stroke-width="0.8" opacity="0.6" />
  
  <!-- Center Calligraphic Studio Monogram '&' -->
  <text 
    x="32" 
    y="41.5" 
    font-family="'Cormorant Garamond', 'Playfair Display', Georgia, 'Times New Roman', serif" 
    font-size="33" 
    font-weight="500" 
    font-style="italic" 
    fill="#FBF9F5" 
    text-anchor="middle">
    &amp;
  </text>

  <!-- Tactile wax surface highlight -->
  <path d="M14 24 A 20 20 0 0 1 32 12" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.25" />
</svg>
